services:
  client:
    build: ./client
    restart: on-failure
    volumes:
      - ./client:/app
      - /app/node_modules
      - ./static:/app/dist
    command: ["npm", "run", "build"]

  nginx:
    image: nginx
    restart: on-failure
    volumes:
      - ./static:/www/static
      - ./data/nginx/app.prod.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled
    ports:
      - 80:80
      - 443:443
    depends_on:
      - backend
