services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: 'conjugaciones-user'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PASSWORD}
      POSTGRES_DB: 'conjugaciones'
    volumes:
      # postgres 18+ images keep data in a versioned subdirectory of this path
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conjugaciones-user -d conjugaciones"]
      interval: 2s
      timeout: 5s
      retries: 15

  client:
    build: ./client
    container_name: client
    restart: on-failure
    ports:
      - 9000:9000
    volumes:
      - ./client:/app
      # keep the image's node_modules from being hidden by the ./client bind mount
      - /app/node_modules
      - ./static:/app/dist
    command: ["npm", "run", "start"]

  backend:
    build: ./conjugaciones_api
    restart: on-failure
    container_name: backend
    volumes:
      - ./conjugaciones_api:/app
    depends_on:
      db:
        condition: service_healthy
      client:
        condition: service_started
      redis:
        condition: service_started
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  nginx:
    container_name: nginx
    image: nginx
    restart: on-failure
    volumes:
      - ./static:/www/static
      - ./data/nginx/app.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
      - 443:443
    depends_on:
      - backend

  redis:
    container_name: redis
    image: redis:8
